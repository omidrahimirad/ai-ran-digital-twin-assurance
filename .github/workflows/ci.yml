name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=ai_ran_assurance --cov-report=term-missing --cov-report=xml --cov-report=json:artifacts/coverage.json
      - if: matrix.python-version == '3.11'
        run: uv run ai-ran-assurance demo --scenario congestion > /tmp/demo.json
      - if: matrix.python-version == '3.11'
        run: uv run python scripts/run_benchmark.py
      - if: matrix.python-version == '3.11'
        run: git diff --exit-code -- artifacts/sample_results.json docs/results.md
      - if: matrix.python-version == '3.11'
        run: uv run ai-ran-assurance evaluate-ai --provider fixture --profile smoke
      - if: matrix.python-version == '3.11'
        run: git diff --exit-code -- reports/ai_evaluation

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv export --quiet --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
      - run: uvx --from pip-audit==2.9.0 pip-audit --requirement /tmp/runtime-requirements.txt --disable-pip
      - run: uvx --from bandit==1.8.6 bandit -q -r src dashboard scripts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - run: docker compose config --quiet
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: ai-ran-assurance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          docker run --rm ai-ran-assurance:ci python -m ai_ran_assurance.cli investigate
          --scenario congestion --provider fixture > /tmp/container-investigation.json
