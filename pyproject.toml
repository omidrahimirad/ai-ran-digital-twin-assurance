[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-ran-digital-twin-assurance"
version = "0.1.0"
description = "Simulation-based AI-assisted RAN assurance and lightweight network digital twin"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Omid Rahimi" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "numpy>=1.26,<2.4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-networkx>=3.4,<4",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
ai-ran-assurance = "ai_ran_assurance.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ran_assurance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["slow: slower smoke or benchmark tests"]

[tool.coverage.run]
source = ["ai_ran_assurance"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
